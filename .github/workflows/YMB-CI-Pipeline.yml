# This pipeline runs automated tests every time code is pushed or a pull request is opened to main, and GitHub keeps a record of who made the change, when, and whether it passed or failed.
# That gives Ben Secure the configuration history he needs to show OSFI during an audit, and a failed test flags bad code before it can reach YMB's production systems.

name: YMB Banking App CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run pytest
        run: pytest test_main.py -v